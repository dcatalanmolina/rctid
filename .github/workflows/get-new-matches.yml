name: Fetch 2025 football data

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual triggering from GitHub
 
jobs:
  fetch_data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libx11-dev

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      
    - name: Set up dependencies
      uses: r-lib/actions/setup-r-dependencies@v2

    - name: Import data
      run: |
        Rscript -e 'source("get_2025_football_data.R")'
      
    - name: Commit results
      run: |
        git config --local user.email "dcatalanmolina@gmail.com"
        git config --local user.name "dcatalanmolina"
        git add data/mls_25.rds
        git add data/mls_25_defense.rds
        git commit -m 'Data updated' || echo "No changes to commit"
        git push origin || echo "No changes to commit"

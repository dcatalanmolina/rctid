name: Fetch 2025 football data

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual triggering from GitHub
 
jobs:
  fetch_data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      
    - name: Install packages
      uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse 
            any::worldfootballR

    - name: Import data
      run: |
        Rscript -e 'source("get_2025_football_data.R")'
      
    - name: Commit results
        env: 
          RCTID_DAILY_DATA_TOKEN: ${{ secrets.RCTID_DAILY_DATA_TOKEN }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/mls_25.rds
          git add data/mls_25_defense.rds
          git commit -m 'Data updated' || echo "No changes to commit"
          git push https://${{ secrets.RCTID_DAILY_DATA_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main